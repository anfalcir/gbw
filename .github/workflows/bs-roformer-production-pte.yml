name: BS-RoFormer Production PTE

on:
  push:
    branches:
      - dev/android-6.0
    paths:
      - 'android/tools/export_bs_roformer_production.py'
      - '.github/workflows/bs-roformer-production-pte.yml'

permissions:
  contents: read

env:
  BSR_CACHE_DIR: /home/runner/.cache/gbw-bs-roformer-sw
  BSR_MODEL_REV: a443a2985534b3bc815ef54a5d446c6a0390f974
  BSR_CKPT_SHA256: 24e7d35ee9c64415673d3fd33e06a67cac2c103c5df6267ba1576459c775916e
  BSR_CKPT_BYTES: '699412152'

jobs:
  export:
    name: Export exact T1151 XNNPACK PTE
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache verified source checkpoint
        uses: actions/cache@v4
        with:
          path: ${{ env.BSR_CACHE_DIR }}
          key: bsr-sw-${{ env.BSR_CKPT_SHA256 }}

      - name: Download and verify source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BSR_CACHE_DIR"
          ckpt="$BSR_CACHE_DIR/BS-Rofo-SW-Fixed.ckpt"
          base="https://huggingface.co/enerjazzer/BS-ROFO-SW-Fixed/resolve/$BSR_MODEL_REV"

          verify_ckpt() {
            [[ -f "$ckpt" ]] &&
            [[ "$(stat -c%s "$ckpt")" == "$BSR_CKPT_BYTES" ]] &&
            echo "$BSR_CKPT_SHA256  $ckpt" | sha256sum -c -
          }

          if ! verify_ckpt; then
            rm -f "$ckpt" "$ckpt.part"
            curl --fail --location --retry 5 --retry-delay 2 \
              "$base/BS-Rofo-SW-Fixed.ckpt?download=true" \
              -o "$ckpt.part"
            [[ "$(stat -c%s "$ckpt.part")" == "$BSR_CKPT_BYTES" ]]
            echo "$BSR_CKPT_SHA256  $ckpt.part" | sha256sum -c -
            mv "$ckpt.part" "$ckpt"
          fi
          verify_ckpt

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # ExecuTorch 1.3.1 portable runtime is built against the torch 2.12
          # ABI. Pin the CPU wheel explicitly so pip cannot silently resolve a
          # newer torch whose C10 symbols are incompatible with _portable_lib.
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.12.1+cpu'
          python -m pip install 'executorch==1.3.1'
          # Install the inference package dependencies explicitly so the source
          # can be installed with --no-deps without giving pip permission to
          # replace the torch ABI pin above.
          python -m pip install \
            'numpy>=2.0' \
            'soundfile>=0.12' \
            'ml-collections>=0.1.1' \
            'tqdm>=4.64' \
            'beartype>=0.14' \
            'rotary-embedding-torch>=0.3.5' \
            'einops>=0.6.1' \
            'PyYAML>=6.0' \
            'requests>=2.31' \
            'packaging>=24.2'
          # Keep the exact 0.1.5 source revision used by the Linux baseline.
          python -m pip install --force-reinstall --no-deps \
            'git+https://github.com/openmirlab/bs-roformer-infer.git@244cddd4f7611956eb1cc4958e82b65b4891c019'
          python -m pip freeze > bs-roformer-production-freeze.txt

      - name: ExecuTorch Python ABI smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          assert torch.__version__.startswith("2.12.1"), torch.__version__
          from executorch.runtime import Runtime
          runtime = Runtime.get()
          assert runtime is not None
          print("EXECUTORCH_PYTHON_ABI_OK", torch.__version__)
          PY

      - name: Export production PTE
        working-directory: android
        run: |
          python tools/export_bs_roformer_production.py \
            --checkpoint "$BSR_CACHE_DIR/BS-Rofo-SW-Fixed.ckpt" \
            --output-dir build/bs-roformer-production

      - name: Publish metadata
        if: always()
        shell: bash
        run: |
          if [[ -f android/build/bs-roformer-production/BS-RoFormer-SW-executorch-metadata.json ]]; then
            {
              echo '## BS-RoFormer production PTE'
              echo
              echo '~~~json'
              cat android/build/bs-roformer-production/BS-RoFormer-SW-executorch-metadata.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production PTE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GBW-BS-RoFormer-SW-production-${{ github.run_number }}
          path: |
            android/build/bs-roformer-production/GBW-BS-RoFormer-SW-executorch-1.3.1-T1151.pte
            android/build/bs-roformer-production/BS-RoFormer-SW-executorch-metadata.json
            android/build/bs-roformer-production/SHA256SUMS.txt
            bs-roformer-production-freeze.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
