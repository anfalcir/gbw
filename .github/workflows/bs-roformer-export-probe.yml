name: BS-RoFormer Export Probe

on:
  push:
    branches:
      - dev/android-6.0
    paths:
      - 'android/tools/bs_roformer_export_probe.py'
      - '.github/workflows/bs-roformer-export-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe PyTorch to ExecuTorch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'executorch==1.3.1'
          python -m pip install \
            'beartype>=0.14' \
            'rotary-embedding-torch>=0.3.5' \
            'einops>=0.6.1' \
            'ml-collections>=0.1.1' \
            'PyYAML>=6.0'
          python -m pip install --no-deps \
            'git+https://github.com/openmirlab/bs-roformer-infer.git@244cddd4f7611956eb1cc4958e82b65b4891c019'
          python -m pip freeze > bs-roformer-probe-freeze.txt

      - name: Run export feasibility probe
        working-directory: android
        run: python tools/bs_roformer_export_probe.py

      - name: Publish probe summary
        if: always()
        shell: bash
        run: |
          if [[ -f android/bs-roformer-export-probe.md ]]; then
            cat android/bs-roformer-export-probe.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BS-RoFormer-export-probe-${{ github.run_number }}
          path: |
            android/bs-roformer-export-probe.json
            android/bs-roformer-export-probe.md
            bs-roformer-probe-freeze.txt
          if-no-files-found: warn
          retention-days: 30
