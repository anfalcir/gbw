name: Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbw-android-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed production APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GBW_RELEASE_KEYSTORE_B64: ${{ secrets.GBW_RELEASE_KEYSTORE_B64 }}
      GBW_RELEASE_STORE_PASSWORD: ${{ secrets.GBW_RELEASE_STORE_PASSWORD }}
      GBW_RELEASE_KEY_ALIAS: ${{ secrets.GBW_RELEASE_KEY_ALIAS }}
      GBW_RELEASE_KEY_PASSWORD: ${{ secrets.GBW_RELEASE_KEY_PASSWORD }}
      GBW_RELEASE_CERT_SHA256: ${{ secrets.GBW_RELEASE_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE || {
            echo "Production release blocked: repository LICENSE is missing." >&2
            exit 1
          }
          test -f docs/ANDROID_THIRD_PARTY.md
          for name in             GBW_RELEASE_KEYSTORE_B64             GBW_RELEASE_STORE_PASSWORD             GBW_RELEASE_KEY_ALIAS             GBW_RELEASE_KEY_PASSWORD             GBW_RELEASE_CERT_SHA256; do
            test -n "${!name:-}" || {
              echo "Production release blocked: missing secret $name" >&2
              exit 1
            }
          done
          EXPECTED="$(printf '%s' "$GBW_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "${#EXPECTED}" -eq 64 || {
            echo "GBW_RELEASE_CERT_SHA256 must be a SHA-256 fingerprint." >&2
            exit 1
          }
          test "$EXPECTED" != "6d60524d7817a0ef907f70922d30f129325282451049accfd221222b60ef6dd0" || {
            echo "Production certificate must differ from the public homologation key." >&2
            exit 1
          }

      - name: Materialize production keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/gbw-production.p12"
          printf '%s' "$GBW_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "GBW_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-37.0"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Release architecture gates
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_demucs_only.py --source .
          python3 scripts/verify_notification_icon.py
          bash scripts/validate_domain.sh
          python3 scripts/verify_project_scoped_workflow.py
          python3 scripts/verify_online_source_resilience.py
          python3 scripts/verify_original_only.py
          python3 scripts/verify_release_ux.py
          python3 scripts/verify_hardening_contracts.py
          python3 scripts/verify_release_pipeline.py

      - name: Cache pinned Demucs checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/gbw/demucs
          key: gbw-demucs-09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856

      - name: Demucs model checkpoint smoke
        working-directory: android
        env:
          GBW_MODEL_CACHE_DIR: ~/.cache/gbw/demucs
        run: bash scripts/validate_demucs_model.sh

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android Lint
        working-directory: android
        run: gradle --no-daemon --stacktrace lintRelease

      - name: Assemble signed release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify production signature and APK contract
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$OUTPUT"
          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$GBW_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" != "6d60524d7817a0ef907f70922d30f129325282451049accfd221222b60ef6dd0"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/libgbw_demucs.so"
          if unzip -l "$APK" | grep -Eqi 'libgbw_rubberband|bsroformer|pffft|executorch|xnnpack|\.pte'; then
            echo "Forbidden/dead runtime found in production APK." >&2
            exit 1
          fi
          python3 scripts/verify_demucs_only.py --apk "$APK"
          python3 scripts/verify_demucs_runtime.py "$APK"
          python3 scripts/verify_apk_java_runtime.py "$APK"
          echo "APK_PRODUCTION_SIGNING_OK=$ACTUAL"

      - name: Package release artifact
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          OUT="app/build/outputs/apk/release/Guitar_Backing_Wizard_${VERSION}.apk"
          cp "$APK" "$OUT"
          SHA256="$(sha256sum "$OUT" | awk '{print $1}')"
          BYTES="$(stat -c%s "$OUT")"
          CERT="$(printf '%s' "$GBW_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          printf '%s  %s\n' "$SHA256" "$(basename "$OUT")" > app/build/outputs/apk/release/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "version=${VERSION}"
            echo "bytes=${BYTES}"
            echo "sha256=${SHA256}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "product_audio_policy=original-only"
            echo "signing_profile=production-private"
            echo "signing_certificate_sha256=${CERT}"
            echo "demucs_model_contract=htdemucs_6s"
            echo "demucs_model_sha256=09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856"
            echo "android_abi=arm64-v8a"
          } > app/build/outputs/apk/release/build-info.txt
          printf '%s\n'             "## GBW Android production release"             "- Version: ${VERSION}"             "- Commit: ${GITHUB_SHA}"             "- APK bytes: ${BYTES}"             "- APK SHA-256: ${SHA256}"             "- Production signing cert SHA-256: ${CERT}"             >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-production-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/Guitar_Backing_Wizard_*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
            android/app/build/outputs/apk/release/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-production-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
