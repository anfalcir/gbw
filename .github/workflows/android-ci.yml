name: Android CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbw-android-manual
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Domain smoke test
        working-directory: android
        run: bash scripts/validate_domain.sh

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-6.0.0-alpha1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
