name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbw-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Toolchain info
        working-directory: android
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -120

      - name: Domain parity smoke
        working-directory: android
        run: bash scripts/validate_domain.sh

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android Lint
        working-directory: android
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Generate build metadata
        id: metadata
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "app-debug.apk" > app/build/outputs/apk/debug/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "sha256=${SHA256}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "rubberband_version=4.0.0"
            echo "rubberband_commit=1d95888bec3ae0a17c0c4af791810d5a63f6bc35"
            echo "android_abi=arm64-v8a"
          } > app/build/outputs/apk/debug/build-info.txt
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "## GBW Android build"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- APK SHA-256: \`${SHA256}\`"
            echo "- Rubber Band: \`4.0.0 @ 1d95888bec3ae0a17c0c4af791810d5a63f6bc35\`"
            echo "- Native ABI: \`arm64-v8a\`"
            echo "- Artifact: \`GBW-Android-debug-${GITHUB_RUN_NUMBER}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
