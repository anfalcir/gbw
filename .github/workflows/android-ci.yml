name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbw-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Toolchain info
        working-directory: android
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -120

      - name: Demucs-only source architecture gate
        working-directory: android
        run: python3 scripts/verify_demucs_only.py --source .

      - name: Notification small-icon mask gate
        working-directory: android
        run: python3 scripts/verify_notification_icon.py

      - name: Domain parity smoke
        working-directory: android
        run: bash scripts/validate_domain.sh

      - name: Project-scoped workflow gate
        working-directory: android
        run: python3 scripts/verify_project_scoped_workflow.py

      - name: Online source resilience gate
        working-directory: android
        run: python3 scripts/verify_online_source_resilience.py

      - name: Original-only architecture gate
        working-directory: android
        run: python3 scripts/verify_original_only.py

      - name: Release UX architecture gate
        working-directory: android
        run: python3 scripts/verify_release_ux.py

      - name: Final hardening contracts gate
        working-directory: android
        run: python3 scripts/verify_hardening_contracts.py

      - name: Release pipeline contract gate
        working-directory: android
        run: python3 scripts/verify_release_pipeline.py

      - name: Cache pinned Demucs checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/gbw/demucs
          key: gbw-demucs-09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856

      - name: Demucs model checkpoint smoke
        working-directory: android
        env:
          GBW_MODEL_CACHE_DIR: ~/.cache/gbw/demucs
        run: bash scripts/validate_demucs_model.sh

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android Lint
        working-directory: android
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify stable homologation signing certificate
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="6d60524d7817a0ef907f70922d30f129325282451049accfd221222b60ef6dd0"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$OUTPUT"
          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unexpected APK signing certificate: $ACTUAL" >&2
            exit 1
          fi
          echo "APK_HOMOLOGATION_SIGNING_OK=$ACTUAL"

      - name: Verify native APK contents
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/libgbw_demucs.so"
          if unzip -l "$APK" | grep -Fqi "libgbw_rubberband.so"; then
            echo "Removed transposition runtime remains in APK" >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -Eqi 'bsroformer|pffft|executorch|xnnpack|\.pte'; then
            echo "Dead multi-engine runtime remains in APK" >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -Fq "lib/arm64-v8a/libopenblas.so"; then
            echo "OpenBLAS must be statically linked into libgbw_demucs.so" >&2
            exit 1
          fi
          echo "APK_NATIVE_ORIGINAL_ONLY_OK"
          echo "APK_NATIVE_DEMUCS_OPENBLAS_STATIC_OK"

      - name: Verify Demucs-only APK architecture
        working-directory: android
        run: python3 scripts/verify_demucs_only.py --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Verify optimized Demucs/OpenBLAS runtime
        working-directory: android
        run: python3 scripts/verify_demucs_runtime.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify FFmpegKit Java runtime classes
        working-directory: android
        run: python3 scripts/verify_apk_java_runtime.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify merged worker manifest contract
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/(merged_manifest|merged_manifests|process.*Manifest)/' | head -1)"
          test -n "$MANIFEST"
          grep -Fq 'android:name="com.gbw.android.background.MediaProcessingService"' "$MANIFEST"
          grep -Fq 'android:process=":media"' "$MANIFEST"
          grep -Fq 'android:foregroundServiceType="dataSync|mediaProcessing"' "$MANIFEST"
          echo "APK_WORKER_PROCESS_CONTRACT_OK"

      - name: Generate build metadata
        id: metadata
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          BYTES="$(stat -c%s "$APK")"
          printf '%s  %s\n' "$SHA256" "app-debug.apk" > app/build/outputs/apk/debug/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "bytes=${BYTES}"
            echo "sha256=${SHA256}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "product_audio_policy=original-only"
            echo "demucs_cpp_commit=f1206e9adeea103aef4a636b9e62297cf1f8e34e"
            echo "eigen_commit=dd8c71e62852b2fe429edb6682ac91fd1c578a26"
            echo "openblas_version=0.3.34"
            echo "openblas_commit=e0166008be8e466242aa76b2ff75ce3f0fbf574a"
            echo "demucs_blas_default_threads=1"
            echo "demucs_blas_supported_threads=1,2"
            echo "demucs_chunk_parallelism=1"
            echo "demucs_model_contract=htdemucs_6s"
            echo "demucs_model_source_revision=5f5daffffcf06ad7b27a7285da327e18ea62068a"
            echo "demucs_model_bytes=54855129"
            echo "demucs_model_sha256=09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856"
            echo "android_abi=arm64-v8a"
            echo "signing_profile=homologation-public-test-key"
            echo "signing_certificate_sha256=6d60524d7817a0ef907f70922d30f129325282451049accfd221222b60ef6dd0"
          } > app/build/outputs/apk/debug/build-info.txt
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            "## GBW Android build" \
            "- Commit: ${GITHUB_SHA}" \
            "- APK bytes: ${BYTES}" \
            "- APK SHA-256: ${SHA256}" \
            "- Audio policy: original-only" \
            "- demucs.cpp: f1206e9adeea103aef4a636b9e62297cf1f8e34e" \
            "- Eigen: dd8c71e62852b2fe429edb6682ac91fd1c578a26" \
            "- OpenBLAS: 0.3.34 @ e0166008be8e466242aa76b2ff75ce3f0fbf574a" \
            "- Demucs BLAS policy: 1/2 threads; default 1; one chunk at a time" \
            "- Demucs model: htdemucs_6s @ 5f5daffffcf06ad7b27a7285da327e18ea62068a" \
            "- Demucs model SHA-256: 09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856" \
            "- Native ABI: arm64-v8a" \
            "- Homologation signing cert SHA-256: 6d60524d7817a0ef907f70922d30f129325282451049accfd221222b60ef6dd0" \
            "- Artifact: GBW-Android-debug-${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
