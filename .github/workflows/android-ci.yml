name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbw-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Toolchain info
        working-directory: android
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -120

      - name: Domain parity smoke
        working-directory: android
        run: bash scripts/validate_domain.sh

      - name: Rubber Band R3 host golden smoke
        working-directory: android
        run: bash scripts/validate_rubberband_host.sh

      - name: BS-RoFormer spectral DSP host golden smoke
        working-directory: android
        run: bash scripts/validate_bs_roformer_spectral_host.sh

      - name: Cache pinned Demucs checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/gbw/demucs
          key: gbw-demucs-09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856

      - name: Demucs model checkpoint smoke
        working-directory: android
        env:
          GBW_MODEL_CACHE_DIR: ~/.cache/gbw/demucs
        run: bash scripts/validate_demucs_model.sh

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android Lint
        working-directory: android
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify native APK contents
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/libgbw_rubberband.so"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/libgbw_demucs.so"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/libgbw_bsroformer_spectral.so"
          echo "APK_NATIVE_R3_OK"
          echo "APK_NATIVE_DEMUCS_OK"
          echo "APK_NATIVE_BSROFORMER_SPECTRAL_OK"

      - name: Generate build metadata
        id: metadata
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "app-debug.apk" > app/build/outputs/apk/debug/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "sha256=${SHA256}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "rubberband_version=4.0.0"
            echo "rubberband_commit=1d95888bec3ae0a17c0c4af791810d5a63f6bc35"
            echo "demucs_cpp_commit=f1206e9adeea103aef4a636b9e62297cf1f8e34e"
            echo "eigen_commit=dd8c71e62852b2fe429edb6682ac91fd1c578a26"
            echo "pffft_commit=e1dbebc9fbf74247d12f094accbbc470aaee8715"
            echo "bs_roformer_source_commit=244cddd4f7611956eb1cc4958e82b65b4891c019"
            echo "bs_roformer_checkpoint_sha256=24e7d35ee9c64415673d3fd33e06a67cac2c103c5df6267ba1576459c775916e"
            echo "bs_roformer_pte_file=GBW-BS-RoFormer-SW-executorch-1.3.1-T1151.pte"
            echo "bs_roformer_pte_bytes=700284960"
            echo "bs_roformer_pte_sha256=8c3cc68404b7fadb2a41ec332b0493290d956f9490dc5c21c5120ee596807182"
            echo "bs_roformer_pte_backend=XNNPACK"
            echo "bs_roformer_executorch_version=1.3.1"
            echo "bs_roformer_torch_export_version=2.12.1+cpu"
            echo "bs_roformer_pte_source_run=35289168951"
            echo "demucs_model_contract=htdemucs_6s"
            echo "demucs_model_source_revision=5f5daffffcf06ad7b27a7285da327e18ea62068a"
            echo "demucs_model_bytes=54855129"
            echo "demucs_model_sha256=09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856"
            echo "android_abi=arm64-v8a"
          } > app/build/outputs/apk/debug/build-info.txt
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "## GBW Android build"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- APK SHA-256: \`${SHA256}\`"
            echo "- Rubber Band: \`4.0.0 @ 1d95888bec3ae0a17c0c4af791810d5a63f6bc35\`"
            echo "- demucs.cpp: \`f1206e9adeea103aef4a636b9e62297cf1f8e34e\`"
            echo "- BS-RoFormer spectral DSP: \`PFFFT @ e1dbebc9fbf74247d12f094accbbc470aaee8715\`"
            echo "- Demucs model: \`htdemucs_6s @ 5f5daffffcf06ad7b27a7285da327e18ea62068a\`"
            echo "- Demucs model SHA-256: \`09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856\`"
            echo "- Native ABI: \`arm64-v8a\`"
            echo "- Artifact: \`GBW-Android-debug-${GITHUB_RUN_NUMBER}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBW-Android-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
